services:
  wsbro:
    build: .
    ports:
      - "6001:6001"
    environment:
      WSBRO_PORT: "6001"
      WSBRO_APP_ID: "app-id"
      WSBRO_APP_KEY: "app-key"
      WSBRO_APP_SECRET: "app-secret"
      WSBRO_DASHBOARD_PASSWORD: ""
    restart: unless-stopped

  # Uncomment for Redis adapter
