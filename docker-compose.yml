# Local WSBro with the dashboard: http://localhost:6001/dashboard (password: secret)
services:
  wsbro:
    build: .
    ports:
      - "6001:6001"
    environment:
      WSBRO_APP_ID: app-id
      WSBRO_APP_KEY: app-key
      WSBRO_APP_SECRET: app-secret
      WSBRO_DASHBOARD_PASSWORD: secret
      # Uncomment to run several instances behind a load balancer:
      # WSBRO_ADAPTER: redis
      # WSBRO_REDIS_ADDR: redis:6379
    restart: unless-stopped

  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
