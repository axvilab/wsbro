# End-to-end environment: WSBro built from this repository, a Laravel 13 app and a test runner
# that talks to both with laravel-echo and pusher-js.
#
#   docker compose up --build --abort-on-container-exit --exit-code-from e2e
#   LARAVEL=11 BROADCASTER=pusher docker compose up --build --abort-on-container-exit --exit-code-from e2e

services:
  wsbro:
    build: ../..
    environment:
      WSBRO_DASHBOARD_PASSWORD: secret
      WSBRO_APPS: >
        [{"id":"app-1","key":"app-key-1","secret":"app-secret-1","webhook_url":"http://laravel:8000/api/wsbro/webhook"},
         {"id":"app-2","key":"app-key-2","secret":"app-secret-2"}]
    ports:
      - "6001:6001"

  laravel:
    build:
      context: .
      args:
        LARAVEL: ${LARAVEL:-13}
    environment:
      APP_ENV: local
      APP_KEY: base64:2fl+Ktvkfl+Fuz4Qp/A75G2RTiWVA/ZoKZvp6fiiM10=
      APP_URL: http://laravel:8000
      BROADCAST_CONNECTION: ${BROADCASTER:-reverb}
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      REVERB_APP_ID: app-1
      REVERB_APP_KEY: app-key-1
      REVERB_APP_SECRET: app-secret-1
      REVERB_HOST: wsbro
      REVERB_PORT: 6001
      REVERB_SCHEME: http
      PUSHER_APP_ID: app-1
      PUSHER_APP_KEY: app-key-1
      PUSHER_APP_SECRET: app-secret-1
      PUSHER_HOST: wsbro
      PUSHER_PORT: 6001
      PUSHER_SCHEME: http
    ports:
      - "8000:8000"
    depends_on:
      wsbro:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 2s
      retries: 30

  e2e:
    image: node:22-alpine
    working_dir: /e2e
    volumes:
      - ./e2e:/e2e
    environment:
      BROADCASTER: ${BROADCASTER:-reverb}
      LARAVEL_URL: http://laravel:8000
      WSBRO_HOST: wsbro
      WSBRO_PORT: 6001
    command: sh -c "npm ci --no-audit --no-fund --silent && node --test"
    depends_on:
      laravel:
        condition: service_healthy
